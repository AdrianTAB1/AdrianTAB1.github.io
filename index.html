<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Support</title>
    <style>
      :root {
        --bg: #f6f6f6;
        --card: #ffffff;
        --accent: #f4a100;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .container {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      .card {
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 32px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .subtitle {
        color: var(--muted);
        margin: 0 0 24px;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .links a {
        display: block;
        padding: 14px 18px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        text-align: center;
      }
      .links a.secondary {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .links a:hover {
        filter: brightness(0.95);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>App Support</h1>
        <p class="subtitle">TradeHub help and legal information</p>
        <ul class="links">
          <li>
            <a href="/tradehub/support/">TradeHub Support</a>
          </li>
          <li>
            <a class="secondary" href="/tradehub/privacy/">TradeHub Privacy Policy</a>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
